{% set name = "fs.webdavfs" %}
{% set version = "0.4.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fs.webdavfs-{{ version }}.zip
  sha256: 282ebe9deb752cf071b9d2f6f85675de9cf05aa28b3a05f4689a7aac5637f3ba

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - nose
    - pip
    - python {{ python_min }}
  run:
    - cachetools
    - fs >2.0
    - python >={{ python_min }}
    - python-dateutil
    - webdavclient3

test:
  imports:
    - webdavfs
    - webdavfs.webdavfs
    - webdavfs.opener
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}


about:
  home: https://github.com/PyFilesystem/webdavfs
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: WebDAV support for pyfilesystem2
  doc_url: https://github.com/PyFilesystem/webdavfs
  dev_url: https://github.com/PyFilesystem/webdavfs

extra:
  recipe-maintainers:
    - ReimarBauer
